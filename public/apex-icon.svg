<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- F1 Scuderia Red Linear Gradients -->
    <linearGradient id="apexRedPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="50%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#B00000" />
    </linearGradient>

    <linearGradient id="apexRedSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="60%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#8A0000" />
    </linearGradient>

    <linearGradient id="apexRedDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B80400" />
      <stop offset="100%" stop-color="#5E0000" />
    </linearGradient>

    <linearGradient id="apexWhiteStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0D6E0" />
    </linearGradient>

    <linearGradient id="carbonFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242833" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>

    <filter id="f1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group: Standalone Razor-Sharp APEX Speed Chevron -->
  <g id="apex-mark" transform="translate(0, 0)">
    
    <!-- Outer Stealth Aero Slices (Left & Right Flanks) -->
    <!-- Left Outer Aero Fin -->
    <polygon points="68,390 128,406 198,272 152,260" fill="url(#apexRedDark)" opacity="0.85" />
    <polygon points="152,260 198,272 256,160 220,152" fill="url(#apexRedSecondary)" />

    <!-- Right Outer Aero Fin -->
    <polygon points="444,390 384,406 314,272 360,260" fill="url(#apexRedDark)" opacity="0.85" />
    <polygon points="360,260 314,272 256,160 292,152" fill="url(#apexRedPrimary)" />

    <!-- Secondary Lower Speed Chevron (Dynamic Negative Space Tier) -->
    <!-- Lower Left Wing -->
    <polygon points="256,236 156,432 208,446 256,352" fill="url(#apexRedPrimary)" />
    <!-- Lower Right Wing -->
    <polygon points="256,236 256,352 304,446 356,432" fill="url(#apexRedSecondary)" />
    <!-- Lower Apex Sharp Inner Cut -->
    <polygon points="256,270 206,370 256,334 306,370" fill="url(#carbonFacet)" opacity="0.95" />

    <!-- Primary Upper Apex Master Chevron (The Main Racing Vertex) -->
    <!-- Left Master Blade -->
    <polygon points="256,48 94,360 158,376 256,184" fill="url(#apexRedPrimary)" filter="url(#f1Glow)" />
    <!-- Right Master Blade (Deep Facet) -->
    <polygon points="256,48 256,184 354,376 418,360" fill="url(#apexRedSecondary)" filter="url(#f1Glow)" />

    <!-- Razor-Sharp Center Spine & Highlight Vector -->
    <polygon points="256,48 248,184 256,200 264,184" fill="#FFA3A3" opacity="0.7" />

    <!-- F1 Pure White Telemetry / Apex Speed Cutouts -->
    <polygon points="256,66 242,126 256,146 270,126" fill="url(#apexWhiteStreak)" />
    <!-- Left Aerodynamic Scribing Line -->
    <polygon points="166,326 182,330 236,224 226,220" fill="url(#apexWhiteStreak)" opacity="0.9" />
    <!-- Right Aerodynamic Scribing Line -->
    <polygon points="346,326 330,330 276,224 286,220" fill="url(#apexWhiteStreak)" opacity="0.9" />

    <!-- Ultra-Sharp Apex Needle Tip -->
    <polygon points="256,36 252,60 256,66 260,60" fill="#FFFFFF" />
  </g>
</svg>
