<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Chassis Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E222D" />
      <stop offset="50%" stop-color="#101217" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="35%" stop-color="#800D0A" />
      <stop offset="70%" stop-color="#222631" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <linearGradient id="innerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- F1 Scuderia Red Gradients -->
    <linearGradient id="appRedPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="45%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#9E0000" />
    </linearGradient>

    <linearGradient id="appRedSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="55%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#730000" />
    </linearGradient>

    <linearGradient id="appRedDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A80000" />
      <stop offset="100%" stop-color="#4A0000" />
    </linearGradient>

    <linearGradient id="appWhiteStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D6DCED" />
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="chassisDropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E10600" flood-opacity="0.25" />
    </filter>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Carbon Weave Pattern -->
    <pattern id="carbonWeave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" />
      <path d="M0 0 L4 4 L0 8 Z M4 4 L8 0 L8 8 Z" fill="#000000" opacity="0.18" />
    </pattern>
  </defs>

  <!-- App Icon Base Squircle/Framed Shield with Sharp Bevels -->
  <g filter="url(#chassisDropShadow)">
    <!-- Outer Sharp-Cornered Squircle Container -->
    <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4.5" />
    <!-- Carbon Fiber Micro-Texture Overlay -->
    <rect x="26" y="26" width="460" height="460" rx="94" ry="94" fill="url(#carbonWeave)" />
    <!-- Inner High-Tech Bevel -->
    <rect x="28" y="28" width="456" height="456" rx="92" ry="92" fill="none" stroke="url(#innerBevel)" stroke-width="2" />
  </g>

  <!-- High-Tech Motorsports Telemetry Grid Lines (Subtle) -->
  <g opacity="0.15" stroke="#E10600" stroke-width="1">
    <line x1="24" y1="256" x2="488" y2="256" stroke-dasharray="4 8" />
    <line x1="256" y1="24" x2="256" y2="488" stroke-dasharray="4 8" />
    <!-- Corner Tick Marks -->
    <path d="M 64 80 L 80 80 L 80 64" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <path d="M 448 80 L 432 80 L 432 64" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <path d="M 64 432 L 80 432 L 80 448" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <path d="M 448 432 L 432 432 L 432 448" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Centered APEX Speed Chevron Mark -->
  <g id="apex-app-mark" transform="translate(0, 8)">
    <!-- Outer Stealth Aero Slices (Left & Right Flanks) -->
    <polygon points="106,370 152,382 208,276 172,266" fill="url(#appRedDark)" opacity="0.85" />
    <polygon points="172,266 208,276 256,186 226,180" fill="url(#appRedSecondary)" />

    <polygon points="406,370 360,382 304,276 340,266" fill="url(#appRedDark)" opacity="0.85" />
    <polygon points="340,266 304,276 256,186 286,180" fill="url(#appRedPrimary)" />

    <!-- Secondary Lower Speed Chevron Tier -->
    <polygon points="256,248 174,406 216,418 256,342" fill="url(#appRedPrimary)" />
    <polygon points="256,248 256,342 296,418 338,406" fill="url(#appRedSecondary)" />
    <!-- Inner Dark Core Cutout -->
    <polygon points="256,276 214,358 256,328 298,358" fill="#101218" />

    <!-- Primary Upper Apex Master Chevron -->
    <polygon points="256,92 126,346 178,358 256,204" fill="url(#appRedPrimary)" filter="url(#markGlow)" />
    <polygon points="256,92 256,204 334,358 386,346" fill="url(#appRedSecondary)" filter="url(#markGlow)" />

    <!-- Central Razor Scribing Highlight -->
    <polygon points="256,92 250,204 256,216 262,204" fill="#FFA8A8" opacity="0.8" />

    <!-- High-Speed Telemetry White Accent Cuts -->
    <polygon points="256,108 244,156 256,172 268,156" fill="url(#appWhiteStreak)" />
    <polygon points="186,318 200,322 242,238 234,234" fill="url(#appWhiteStreak)" opacity="0.95" />
    <polygon points="326,318 312,322 270,238 278,234" fill="url(#appWhiteStreak)" opacity="0.95" />

    <!-- Pure White Apex Vertex Tip -->
    <polygon points="256,82 252,102 256,108 260,102" fill="#FFFFFF" />
  </g>
</svg>
